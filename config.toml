# 神经闭环反馈插件配置
#
# [veto] 下的数值、字符串与模板字段留空（或不写）即使用插件代码中的内置默认；
# 仅在你需要覆盖默认值时再填写。插件升级后修改内置默认时，留空字段会自动跟随新默认。

[plugin]
# 是否启用插件
enabled = true
# 配置版本
config_version = "1.2.0"

[veto]
# 哨兵标记名（仅字母/数字/下划线/横线）。replyer 输出 <reject>理由</reject> 即视为触发再审。
# reject_sentinel = "reject"
# 连续触发再审达到该次数时，向规划器注入升级警示文案（替代普通再审反馈）。
# escalate_consecutive_vetoes = 2
# 连续触发再审达到该次数后，不再向 replyer 注入再审协议，也不再拦截哨兵。
# max_consecutive_vetoes = 5
# 连续触发再审计数的时间窗口（秒），窗口过期后计数自动重置。
# veto_window_seconds = 300

# 以下三个模板留空时使用内置默认文案（下方为内置默认参考，默认请保持注释状态）：
# protocol_prompt = """你拥有一条内部再审通道。你收到的回复理由与回复参考信息来自"规划器"——内部负责分析聊天并决定何时回复的决策过程（它不是你，也看不到这条说明）。当你认为规划器提供的回复请求与你掌握的聊天流严重不符时，可以驳回本次回复并要求规划器重新思考，附上再审理由。典型情形包括：规划器把你自己发送的消息错认成了别人的消息；规划器没有理解你之前发送某条消息的理由或意义；规划器未见你发送的全部消息（如开启了智能分段），误以为表达有所缺失而再度调用回复试图补全；规划器思考期间聊天流已有变化，或聊天对象输入有误，致使回复请求失准；由于模型能力差别，规划器对聊天流的理解与你有明显差别，致使回复请求失准；等等。此时请不要生成正常回复，也不要在回复里向聊天对象解释或吐槽，只输出：<{sentinel}>简要说明再审理由</{sentinel}>，除该标记外不要输出任何其他文字。驳回后这条消息不会被发送到聊天流，再审理由会通过内部通道转达给规划器，要求其重新思考。如果回复请求与聊天流相符，请忽略本要求，正常生成回复。"""
# injection_template = """【内部再审反馈·不会发送到聊天流】（角色说明："规划器"指负责分析聊天并调用 reply、finish 等工具做决策的内部过程，即本条消息的接收方；"回复器"指依据回复请求实际撰写回复文本的内部过程。若正在阅读的你只负责撰写回复而不能调用工具，本条消息无需你处理。）回复器认为规划器刚才的回复请求与其掌握的聊天流严重不符，已驳回本次回复并触发再审，要求规划器重新思考。随后工具结果中的"生成可见回复失败"并非技术故障，而是本次再审驳回的结果；规划器请勿原样重试 reply。再审理由：{reason}。请规划器结合该理由重新审视聊天流：特别注意哪些消息其实是规划器自己刚刚发送的、此前发送某条消息的理由或意义、以及是否出现了尚未注意到的新消息。请规划器结合上述再审理由和当前聊天流重新判断，再决定下一步采取何种工具或行动。若规划器选择再次调用 reply，须修正回复请求、更新回复参考信息，并确保已回应驳回理由，不要原样重试。"""
# escalation_template = """【内部再审反馈·不会发送到聊天流】（角色说明："规划器"指负责分析聊天并调用 reply、finish 等工具做决策的内部过程，即本条消息的接收方；"回复器"指依据回复请求实际撰写回复文本的内部过程。若正在阅读的你只负责撰写回复而不能调用工具，本条消息无需你处理。）回复器已在短时间内连续 {count} 次触发再审，最新再审理由：{reason}。这表明规划器的回复请求与聊天流持续不符；在未厘清驳回理由前，规划器若反复调用 reply，虽不会向聊天流发送消息，却会继续在内部被驳回，浪费思考轮次与算力。请规划器结合历次驳回理由和当前聊天流重新审视局势，审慎选择下一步的工具或行动，不要原样重试。若规划器仍决定调用 reply，须修正回复请求、更新回复参考信息，并充分回应历次驳回理由。若规划器审视后确认当前不宜再回复，可调用 finish 结束本轮。"""
# 以上三个模板留空（或不写）时使用内置默认文案；取消注释并修改可自定义。
# protocol_prompt 占位符：{sentinel}
# injection_template 占位符：{reason}、{count}
# escalation_template 占位符：{reason}、{count}
